name: Release (unlisted)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Add-on version (strict major.minor.patch; leave empty to derive from GitVersion)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.x

      - name: GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compose version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          MAJOR_MINOR_PATCH: ${{ steps.gitversion.outputs.majorMinorPatch }}
          DISTANCE: ${{ steps.gitversion.outputs.versionSourceDistance }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            python3 -c "
            import os, re, sys
            version = os.environ['VERSION_INPUT'].strip()
            if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                sys.exit(f'Invalid version: {version!r} (expected strict major.minor.patch, e.g. 0.2.0)')
            with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                out.write(f'version={version}\n')
            print('version (input):', version)
            "
          else
            python3 -c "
            import os
            mmp = os.environ['MAJOR_MINOR_PATCH'].strip()
            distance = int(os.environ['DISTANCE'] or '0')
            major, minor, patch = (int(part) for part in mmp.split('.'))
            version = f'{major}.{minor}.{patch + distance}'
            with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                out.write(f'version={version}\n')
            print('version (GitVersion):', version)
            "
          fi

      - run: npm ci

      - name: Patch manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -c "
          import json, os
          version = os.environ['VERSION']
          with open('manifest.json') as f:
              manifest = json.load(f)
          manifest['version'] = version
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          print('manifest version:', version)
          "

      - run: npm test

      - name: Build unsigned zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          zip -r dist/bezorgfilters-${VERSION}.zip . \
            -x 'dist/*' 'test/*' 'tools/*' 'node_modules/*' '.git/*' '.gitignore' \
               '.github/*' '*.zip' 'README.md' 'package.json' 'package-lock.json'

      - name: Sign with AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          rm -rf sign-src && mkdir sign-src
          unzip -q dist/bezorgfilters-${{ steps.version.outputs.version }}.zip -d sign-src
          npx --yes web-ext sign \
            --source-dir sign-src \
            --channel unlisted \
            --artifacts-dir dist

      - name: Attach xpi to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          XPI=$(ls dist/*.xpi | head -n1)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$XPI" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" "$XPI" \
              --repo "$GITHUB_REPOSITORY" \
              --title "BezorgFilters v$VERSION" \
              --generate-notes
          fi
