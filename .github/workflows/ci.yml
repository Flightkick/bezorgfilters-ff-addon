name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Package add-on
        run: |
          zip -r takeaway-ff-plugin.zip . \
            -x 'test/*' 'node_modules/*' '.git/*' '.gitignore' '.github/*' '*.zip' 'README.md' 'package.json' 'package-lock.json' 'tools/*'
      - uses: actions/upload-artifact@v7
        with:
          name: takeaway-ff-plugin
          path: takeaway-ff-plugin.zip
