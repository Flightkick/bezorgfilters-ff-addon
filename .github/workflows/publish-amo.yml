name: Publish to AMO (listed)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Add-on version (strict major.minor.patch; leave empty to derive from GitVersion)'
        required: false
        type: string
      approval_notes:
        description: 'Notes for the AMO reviewers (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.x

      - name: GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compose version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          MAJOR_MINOR_PATCH: ${{ steps.gitversion.outputs.majorMinorPatch }}
          DISTANCE: ${{ steps.gitversion.outputs.versionSourceDistance }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            python3 -c "import os, re, sys; version = os.environ['VERSION_INPUT'].strip(); (lambda v: sys.exit(f'Invalid version: {v!r} (expected strict major.minor.patch, e.g. 0.2.0)') if not re.fullmatch(r'\d+\.\d+\.\d+', v) else None)(version); open(os.environ['GITHUB_OUTPUT'], 'a').write(f'version={version}\n'); print('version (input):', version)"
          else
            python3 -c "import os; mmp = os.environ['MAJOR_MINOR_PATCH'].strip(); distance = int(os.environ['DISTANCE'] or '0'); major, minor, patch = (int(part) for part in mmp.split('.')); version = f'{major}.{minor}.{patch + distance}'; open(os.environ['GITHUB_OUTPUT'], 'a').write(f'version={version}\n'); print('version (GitVersion):', version)"
          fi

      - run: npm ci

      - name: Patch manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -c "
          import json, os
          version = os.environ['VERSION'].strip()
          with open('manifest.json') as f:
              manifest = json.load(f)
          manifest['version'] = version
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          print('manifest version:', version)
          "

      - run: npm test

      - name: Build unsigned zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          zip -r dist/bezorgfilters-${VERSION}.zip . \
            -x 'dist/*' 'test/*' 'tools/*' 'node_modules/*' '.git/*' '.gitignore' \
               '.github/*' '*.zip' 'README.md' 'package.json' 'package-lock.json' 'LICENSE' 'docs/*'

      - name: Lint packaged add-on (AMO validator)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf sign-src && mkdir sign-src
          unzip -q dist/bezorgfilters-${VERSION}.zip -d sign-src
          npx --yes web-ext lint --source-dir sign-src

      - name: Write AMO metadata
        env:
          APPROVAL_NOTES: ${{ inputs.approval_notes }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          with open('sign-src/manifest.json') as f:
              manifest = json.load(f)
          with open('docs/amo-description.md') as f:
              description = f.read().strip()
          notes = os.environ.get('APPROVAL_NOTES', '').strip()
          metadata = {
              'default_locale': 'en-US',
              'name': {'en-US': manifest['name']},
              'summary': {'en-US': manifest['description']},
              'description': {'en-US': description},
              'homepage': {'en-US': manifest.get('homepage_url')},
              'support_url': {'en-US': manifest.get('homepage_url') + '/issues'},
              'categories': {
                  'firefox': ['shopping'],
                  'android': ['shopping'],
              },
              'version': {
                  'license': 'MIT',
                  **({'approval_notes': notes} if notes else {}),
              },
          }
          with open('amo-metadata.json', 'w') as f:
              json.dump(metadata, f, indent=2)
          print('amo-metadata.json written')
          print(json.dumps(metadata, indent=2))
          PYEOF

      - name: Submit to AMO as listed
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir sign-src \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0 \
            --artifacts-dir dist

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## AMO listed submission" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version \`${VERSION}\` was submitted to addons.mozilla.org (channel: listed)." >> $GITHUB_STEP_SUMMARY
          echo "The version is now pending review; track its status in the" >> $GITHUB_STEP_SUMMARY
          echo "AMO developer dashboard. No signed xpi is produced by this flow:" >> $GITHUB_STEP_SUMMARY
          echo "once approved, AMO hosts and distributes the add-on." >> $GITHUB_STEP_SUMMARY
